[[repos]]
repo = "local"
hooks = [
  { id = "prose-lint", name = "prose lint (.md/.qmd)", entry = "prose-lint", language = "system", files = '\.(md|qmd)$', exclude = '(^|/)\.claude/|-context\.md$' },
  { id = "panache-format", name = "panache format (.md/.qmd)", entry = "panache format --force-exclude", language = "system", files = '\.(md|qmd)$', exclude = '(^|/)(\.claude/|CLAUDE\.md$|PLAN\.md$|DEFERRED\.md$)|-context\.md$' },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.14"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

# pyrefly-check runs with pass_filenames: false, so it type-checks the whole project
# rather than the staged files. It only validates anything where a pyrefly config
# governs the code: without a [tool.pyrefly] table or a pyrefly.toml, pyrefly falls back
# to the basic preset and exits 0 on real type errors (see rules/python.md). A project
# adopting this hook needs that table, empty is enough. Do not add -p here: the flag
# would override the preset of a project that pinned its own.
[[repos]]
repo = "https://github.com/facebook/pyrefly-pre-commit"
rev = "1.1.1"
hooks = [
  { id = "pyrefly-check" }
]

[[repos]]
repo = "https://github.com/posit-dev/air-pre-commit"
rev = "0.9.0"
hooks = [
  { id = "air-format", files = '\.(R|r)$' }
]

[[repos]]
repo = "https://github.com/etiennebacher/jarl-pre-commit"
rev = "0.4.0"
hooks = [
  { id = "jarl-check", files = '\.(R|r)$' }
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  { id = "shellcheck", exclude = '^bash/' }
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"
hooks = [
  { id = "shfmt", args = ["-w", "-i", "2"], exclude = '^bash/' }
]

[[repos]]
repo = "https://github.com/typstyle-rs/pre-commit-typstyle"
rev = "v0.14.4"
hooks = [
  { id = "typstyle", args = ["-i", "-l", "100"] }
]

[[repos]]
repo = "https://github.com/JohnnyMorganz/StyLua"
rev = "v2.5.2"
hooks = [
  { id = "stylua-github", files = '\.lua$' }
]

