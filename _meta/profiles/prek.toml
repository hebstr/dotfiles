# These two keys belong to the conventional-pre-commit block below and are pruned with it.
# prek install only lays down the shims listed in default_install_hook_types, whose default is
# [pre-commit]: a commit-msg hook declared without it never fires, and reports nothing.
# default_stages then pins every other hook to pre-commit, since the default is every stage.
# It earns its place on check-merge-conflict and gitleaks, the two that declare no stages of
# their own and so fire a second time at commit-msg: check-merge-conflict against
# .git/COMMIT_EDITMSG, which its types = ["text"] does not filter out, and gitleaks as a
# redundant rescan of the staged diff, since it takes no filenames at all. The files/types-scoped
# hooks simply never match that path, and check-added-large-files and pyrefly-check already
# declare stages upstream that exclude it.
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
  { id = "prose-lint", name = "prose lint (.md/.qmd)", entry = "prose-lint", language = "system", files = '\.(md|qmd)$', exclude = '(^|/)\.claude/|-context\.md$' },
  { id = "panache-format", name = "panache format (.md/.qmd)", entry = "panache format --force-exclude", language = "system", files = '\.(md|qmd)$', exclude = '(^|/)(\.claude/|CLAUDE\.md$|PLAN\.md$|DEFERRED\.md$|LICENSE\.md$)|-context\.md$' },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" }
]

# Validates the header of the message being written against Conventional Commits, nothing more:
# no prompt, no body or length check, merge and fixup commits skipped. Restricting the types or
# the scopes goes through args, where list parsing is reported unreliable (upstream issue 129).
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

# pyrefly-check runs with pass_filenames: false, so it type-checks the whole project
# rather than the staged files. It only validates anything where a pyrefly config
# governs the code: without a [tool.pyrefly] table or a pyrefly.toml, pyrefly falls back
# to the basic preset and exits 0 on real type errors (see rules/python.md). A project
# adopting this hook needs that table, empty is enough. Do not add -p here: the flag
# would override the preset of a project that pinned its own.
[[repos]]
repo = "https://github.com/facebook/pyrefly-pre-commit"
rev = "1.1.1"
hooks = [
  { id = "pyrefly-check" }
]

[[repos]]
repo = "https://github.com/posit-dev/air-pre-commit"
rev = "0.9.0"
hooks = [
  { id = "air-format", files = '\.(R|r)$' }
]

[[repos]]
repo = "https://github.com/etiennebacher/jarl-pre-commit"
rev = "0.4.0"
hooks = [
  { id = "jarl-check", files = '\.(R|r)$' }
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  { id = "shellcheck", exclude = '^bash/' }
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"
hooks = [
  { id = "shfmt", args = ["-w", "-i", "2"], exclude = '^bash/' }
]

[[repos]]
repo = "https://github.com/typstyle-rs/pre-commit-typstyle"
rev = "v0.14.4"
hooks = [
  { id = "typstyle", args = ["-i", "-l", "100"] }
]

[[repos]]
repo = "https://github.com/JohnnyMorganz/StyLua"
rev = "v2.5.2"
hooks = [
  { id = "stylua-github", files = '\.lua$' }
]

# SQLFluff exits 2 without a dialect, a configuration error rather than a lint failure:
# the commit fails with no violation to act on. A project adopting these hooks needs a
# .sqlfluff or a [tool.sqlfluff.core] table naming its dialect (see rules/sql.md).
# sqlfluff-fix rewrites the staged files, sqlfluff-lint is the validating pass that decides,
# which is why both are listed rather than fix alone.
[[repos]]
repo = "https://github.com/sqlfluff/sqlfluff"
rev = "4.3.0"
hooks = [
  { id = "sqlfluff-fix" },
  { id = "sqlfluff-lint" },
]

