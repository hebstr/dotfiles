[[repos]]
repo = "local"
hooks = [
  { id = "prose-lint", name = "prose lint (.md/.qmd)", entry = "prose-lint", language = "system", files = '\.(md|qmd)$' },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.14"
hooks = [
  { id = "ruff-format" },
  { id = "ruff", args = ["--fix"] },
]

[[repos]]
repo = "https://github.com/posit-dev/air-pre-commit"
rev = "0.9.0"
hooks = [
  { id = "air-format", files = '\.(R|r)$' }
]

[[repos]]
repo = "https://github.com/etiennebacher/jarl-pre-commit"
rev = "0.4.0"
hooks = [
  { id = "jarl-check", files = '\.(R|r)$' }
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.10.0.1"
hooks = [
  { id = "shellcheck", exclude = '^bash/' }
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.0-1"
hooks = [
  { id = "shfmt", args = ["-w", "-i", "2"], exclude = '^bash/' }
]

[[repos]]
repo = "https://github.com/typstyle-rs/pre-commit-typstyle"
rev = "v0.14.4"
hooks = [
  { id = "typstyle", args = ["-i", "-l", "100"] }
]

[[repos]]
repo = "https://github.com/JohnnyMorganz/StyLua"
rev = "v2.5.2"
hooks = [
  { id = "stylua-github", files = '\.lua$' }
]

# lorenzwalthert/precommit R hooks run in an renv-sandboxed env whose bundled
# lockfile does not build under R 4.6: v0.4.3 pins digest 0.6.36 (removed Calloc/Free
