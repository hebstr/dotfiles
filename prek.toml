[[repos]]
repo = "local"
hooks = [
  { id = "symlinks-check", name = "check symlinks", entry = "bin/.local/bin/symlinks-check", language = "system", pass_filenames = false },
  { id = "instructions-budget", name = "always-loaded instructions budget", entry = "bin/.local/bin/instructions-budget", args = ["--budget", "12288"], language = "system", pass_filenames = false, files = '^claude/\.claude/(CLAUDE\.md|rules/|hooks/inject-rules\.sh)' },
  { id = "bats-tests", name = "check bats tests", entry = "bash -c 'j=(); command -v parallel >/dev/null && j=(--jobs \"$(nproc)\"); exec bats \"${j[@]}\" _meta/tests/'", language = "system", pass_filenames = false, files = '^(_meta/tests/|bin/\.local/bin/|claude/\.claude/hooks/|claude/\.claude/skills/[^/]+/scripts/|git/\.config/git/|opencode/\.config/opencode/plugins/)' },
  { id = "shellharden", name = "shellharden (fix with: shellharden --replace <file>)", entry = "shellharden --check", language = "system", types = ["shell"], exclude = '^(agents|_meta/instructions-ab/fixtures)/|\.bats$' },
  { id = "shellharden", name = "shellharden (fix with: shellharden --replace <file>)", entry = "shellharden --check", language = "system", types = ["text"], files = '^bash/\.(profile|bash_logout|blerc)$' },
  { id = "prose-lint", name = "prose lint (.md/.qmd)", entry = "bin/.local/bin/prose-lint", language = "system", files = '\.(md|qmd)$', exclude = '^(_meta/profiles|agents)/' },
  { id = "panache-format", name = "panache format (.md/.qmd)", entry = "panache format", language = "system", files = '\.(md|qmd)$', exclude = '^(agents/|_meta/profiles/|_meta/notes/|claude/\.claude/(CLAUDE\.md|rules/|memory/|skills/))' },
  { id = "perl-syntax", name = "perl syntax check", entry = "bash -c 'rc=0; for f; do perl -c \"$f\" || rc=1; done; exit $rc' perl-syntax", language = "system", types = ["perl"] },
  { id = "pyrefly-check", name = "pyrefly check (.py)", entry = "pyrefly check -p default --ignore-missing-imports pytest",language = "system", files = '\.py$', exclude = '^(agents|_meta/session-discipline)/' },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.7"
hooks = [
  { id = "ruff-check", args = ["--fix"], exclude = '^(agents|_meta/session-discipline)/' },
  { id = "ruff-format", exclude = '^(agents|_meta/session-discipline)/' },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" }
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1-1"
hooks = [
  { id = "shellcheck", exclude = '^(agents|_meta/instructions-ab/fixtures)/' },
  { id = "shellcheck", types = ["text"], files = '^bash/\.(profile|bash_logout|blerc)$' },
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.13.1-1"
hooks = [
  { id = "shfmt", args = ["-w", "-i", "2"], exclude = '^(agents|_meta/instructions-ab/fixtures)/' },
  { id = "shfmt", args = ["-w", "-i", "2"], types = ["text"], files = '^bash/\.(profile|bash_logout|blerc)$' },
]
